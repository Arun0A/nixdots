[[mgr.append_keymap]]
on  = [ "c", "b" ]
run = "shell -- blobdrop %s"
desc = "blobdrop"

[[mgr.append_keymap]]
on  = [ "c", "w" ]
run = "shell -- feh --no-fehbg --bg-fill %s"
desc = "Change Wallpaper"

[[mgr.prepend_keymap]]
on = "q"
run = "quit --no-cwd-file"
desc = "Quit without changing directory"

[[mgr.prepend_keymap]]
on = "<C-g>"
run = "quit"
desc = "Quit and cd here"


[[mgr.prepend_keymap]]
on = ["1"]
run = "plugin rel-motions --args=1"
[[mgr.prepend_keymap]]
on = ["2"]
run = "plugin rel-motions --args=2"
[[mgr.prepend_keymap]]
on = ["3"]
run = "plugin rel-motions --args=3"
[[mgr.prepend_keymap]]
on = ["4"]
run = "plugin rel-motions --args=4"
[[mgr.prepend_keymap]]
on = ["5"]
run = "plugin rel-motions --args=5"
[[mgr.prepend_keymap]]
on = ["6"]
run = "plugin rel-motions --args=6"
[[mgr.prepend_keymap]]
on = ["7"]
run = "plugin rel-motions --args=7"
[[mgr.prepend_keymap]]
on = ["8"]
run = "plugin rel-motions --args=8"
[[mgr.prepend_keymap]]
